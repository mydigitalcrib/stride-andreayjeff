# B — The three films, in detail. The first one starts open.
five:
  kicker: Worth your time
  headline:
    - Three films
    - to *make this week*
  lead: Start with the training, then batch the other two.
  note: Two of the three were on dated public trend trackers during 13–19 Nov. “Two vibes” is an evergreen format from September, and it’s labeled that way on purpose. Instagram and TikTok blocked direct viewing of several examples, and the order is Stride’s creative pick, not a prediction of views.
  items:
    - title: The costeño husband training
      makeItYours: Andrea teaches Jeff three absurdly dramatic habits to become an honorary esposo costeño.
      what: “Teaching him new habits” was in SocialBee’s TikTok trends on 19 Nov. The original shows a playful ritual of teaching a partner to bow. This is your own costeño version.
      more: Andrea announces the test, Jeff tries a tiny respectful bow, then two dance steps, then a dramatically prepared “favorcito”. End with a score out of ten and ask what to teach him next. About 25 seconds, and it can become a series.
      hook: Si Jeff quiere ser esposo costeño, tiene que pasar estas 3 pruebas.
      ways:
        - “Hoy le voy a enseñar a mi esposo coreano lo mínimo para sobrevivir con una costeña.”
        - "TikTok: keep the raw outtakes in."
        - Ask followers for the next “training” challenge, and make it part 2.
      careful: Keep the joke about you two, not what all Korean or Colombian people do. Use your own dialogue, and don’t put the original trend audio in paid ads without the rights.
      brands: Language learning
      links:
        - label: TikTok trends (SocialBee), 19 Nov
          url: https://socialbee.com/blog/tiktok-trends-you-cant-miss/
        - label: See the original format on TikTok
          url: https://www.tiktok.com/@ladypipa/video/7698671089580363041
    - title: My moon, my man
      makeItYours: Your real story, from two separate lives to one Colombian–Korean marriage, in a 22-second reveal.
      what: A romantic couple-reveal montage that trend trackers followed through 13–19 Nov, set to the “My Moon My Man” cover by FINNEAS.
      more: Andrea’s solo photo (“Una colombiana…”), then Jeff’s (“Un coreano…”), then a real early photo of you two on the audio transition, two candid clips together, and a warm recent shot that ends on a genuine laugh. A short voiceover from each of you.
      hook: Dos culturas, dos idiomas… y una historia que ninguno vio venir.
      ways:
        - “Yo solo quería conocerlo… y terminé aprendiendo otro mundo.”
        - "TikTok: a two-photo swipe reveal."
        - "Shorts: a voiceover version with more of your story."
      careful: Use only photos and footage you own and agree to share, and don’t invent milestones or dates. Check the sound is available in your account, and use cleared original music for anything sponsored.
      brands: Travel and eSIM
      links:
        - label: TikTok sounds (Sosial), 18 Nov
          url: https://sosial.app/resources/trending-tiktok-sounds-week-of-november-16-2026
        - label: TikTok trends (Virlo), 9–15 Nov
          url: https://virlo.ai/trending-on-tiktok-this-week/2026-11-09
    - title: Two vibes, one marriage
      makeItYours: Fast split-screen choices showing everything you two still can’t agree on.
      what: A side-by-side preference format from SocialBee’s Instagram trend archive. It dates from September, so it’s evergreen, not a new trend this week, and good to film between the urgent ones.
      more: A split screen titled “2 personalidades, 1 matrimonio”, then breakfast, music (vallenato vs. Jeff’s favorite) and date night, and finish agreeing on a meal together. About 27 seconds. Then ask who’s team Andrea and who’s team Jeff.
      hook: Nos casamos, pero seguimos sin ponernos de acuerdo en ESTO.
      ways:
        - “¿Qué pasa cuando una colombiana y un coreano eligen la cita perfecta?”
        - "Reels: face-to-face still cards."
        - "Shorts: keep only the 3 best comparisons."
      careful: Keep every choice personal. One preference never stands for a whole country.
      brands: Food and grocery, home and retail
      links:
        - label: Instagram trends (SocialBee), September entry
          url: https://socialbee.com/blog/latest-instagram-trends/
        - label: See an example Reel
          url: https://www.instagram.com/reels/DcaefSUS2wt/

# C — No audience-comment research this week, so: questions to ask the audience.
talking:
  nav: Questions to ask
  kicker: Start the conversation
  headline:
    - What to ask
    - "*your*"
    - audience.
  lead: We couldn’t see your comments or Insights this week, so these are questions to ask, not ones we heard.
  questions:
    - text: ¿Qué otra costumbre le enseño?
    - text: ¿De dónde son ustedes y sus parejas?
    - text: ¿Ustedes son team Andrea o team Jeff?
  turn:
    title: Turn it into content
    body: Let the answers make the next videos. The training challenge your followers pick becomes part 2, and the next “two vibes” category comes from a poll in the comments.
  care: Treat traditions as your own experiences, not as traits of all Koreans or Colombians.

# D — Seven ideas: the three films plus the brief's four extras.
ideas:
  kicker: Ready to film
  headline:
    - Seven ideas
    - "*only you two can make*"
  lead: The three films, plus four extras you can batch with them. Tap one to see the hook and how to film it, then save your favorites.
  filming: Batch the extras with the three main films. Keep an original-audio cut of each video, so it can also be used for brand work.
  careful: No invented milestones. Use relationship footage only with your approval, and don’t assume anniversaries or big life events. Treat traditions as your own experiences. A sound cleared for normal posts may not be cleared for paid posts, Spark Ads or brand whitelisting.
  segments:
    - id: comedy
      label: Comedy
    - id: love
      label: Love story
    - id: home
      label: Food & home
  items:
    - id: 1
      segment: comedy
      stage: Couple comedy · film first
      title: The costeño husband training
      format: TikTok or Reels
      time: 25 seconds
      level: Low effort
      hook: Si Jeff quiere ser esposo costeño, tiene que pasar estas 3 pruebas.
      shots:
        - "Two-shot: Andrea announces the test. “Primera regla: cuando yo digo ‘ajá’, tú sabes que se viene algo.”"
        - Jeff tries a tiny respectful bow and looks to camera.
        - "Fast cut to a music cue. Andrea does two steps and Jeff tries: “¡Con actitud! Eso no parece vallenato, mi amor.”"
        - Andrea asks for “un favorcito” and Jeff starts preparing dramatically.
        - You both laugh. A score on screen, and ask what to teach him next.
      caption: Lleva años conmigo y todavía le falta práctica 😂 ¿Qué otra costumbre le enseño?
      brands: Language learning
    - id: 2
      segment: love
      stage: Love story · post while the sound is recognizable
      title: My moon, my man
      format: TikTok or Reels
      time: 15–22 seconds
      level: Low effort
      hook: Dos culturas, dos idiomas… y una historia que ninguno vio venir.
      shots:
        - "Andrea’s solo photo on a neutral background. Text: “Una colombiana…”"
        - "Jeff’s solo photo or an old clip, framed the same way. Text: “Un coreano…”"
        - "On the audio transition, a real early photo of you two. Text: “…y un montón de historias por contar.”"
        - "Two candid clips together: laughing, a walk, food or travel. Andrea’s voiceover: “Todavía me sorprende lo bonito que es aprender del otro.”"
        - "A warm recent shot that ends on a real laugh. Jeff’s voiceover: “Y yo sigo aprendiendo, todos los días.”"
      caption: Hay historias que empiezan con dos mundos diferentes. La nuestra todavía se está escribiendo.
      brands: Travel and eSIM
    - id: 3
      segment: comedy
      stage: Couple comedy · evergreen
      title: Two vibes, one marriage
      format: Instagram Reels
      time: 27 seconds
      level: Low effort
      hook: Nos casamos, pero seguimos sin ponernos de acuerdo en ESTO.
      shots:
        - You both enter a split screen, with “2 personalidades, 1 matrimonio” fixed on screen.
        - "Breakfast: you each point to your choice. “¿Arepita?” “Yo hoy quiero otra cosa.”"
        - Music. Andrea picks vallenato, Jeff picks his own favorite.
        - Date night. One wants a quiet plan, the other is already dressed to go out.
        - "You agree on a shared meal: “¡Comer juntos, siempre!”"
      caption: En gustos no nos parecemos en nada… ¿ustedes son team Andrea o team Jeff?
      brands: Food and grocery, home and retail
    - id: 4
      segment: comedy
      stage: Quick couple skit
      title: When Jeff hears “ahorita”
      format: Short vertical video
      time: 12–18 seconds
      level: Low effort
      hook: Cuando Jeff escucha ‘ahorita’
      shots:
        - Andrea says “ahorita vamos”.
        - Jeff gets ready instantly and checks the clock.
        - He realizes “ahorita” needs context. Keep it short and improvised.
    - id: 5
      segment: home
      stage: Cultural discovery
      title: Explaining a dish from home
      format: Short vertical video
      hook: Cómo explicarle una comida de casa
      shots:
        - Each of you picks one favorite family dish.
        - Explain it to the other in 10 seconds.
        - Taste-test it together. Respect where it comes from, and your own tastes.
      brands: Food partners
    - id: 6
      segment: love
      stage: Marriage storytelling
      title: The phrase we learned living together
      format: Voiceover over candid footage
      hook: La frase que aprendimos viviendo juntos
      shots:
        - Each of you shares one honest lesson about communicating across two languages, or about family traditions.
        - Record it as a short voiceover.
        - Lay it over real, candid footage of you two.
    - id: 7
      segment: home
      stage: Family, pet, lifestyle · optional
      title: Who spoils Jacob more?
      format: Two short clips
      hook: ¿Quién mima más a Jacob?
      shots:
        - Only if it feels right for you both.
        - One clip of how each of you entertains or cares for Jacob.
        - Show your real routines, not invented ones.

