    Andrea & Jeff: the next seven days (14–20 Nov)

    Sat 14: Jeff’s costeño glow-up. Use the comments as a prompt for a sequel.
    Sun 15: First match → today. The emotional counterweight to the comedy. Invite their stories.
    Mon 16: Reply-to-comment mini clip. One real word or pronunciation question from the audience.
    Tue 17: Christmas music is back. Only if your holiday mode has really started.
    Wed 18: Couple POV, dinner choice. A light, relatable beat between the trend edits.
    Thu 19: Food swap or home montage. Colombian and Korean preferences, without stereotypes.
    Fri 20: Review the winners and plan the next test.

    A/B test for the language Reel: “Jeff antes de conocer a una vallenata…” vs. “Jeff aprendió costeño y ahora no hay quien lo pare.” Change one thing at a time when you can.

    What to check in Insights: 3-second hold and average watch time, shares and sends, saves and profile visits, comments by theme.

    These are editorial priorities, not the best times to post. Don’t use estimated views as the goal.

