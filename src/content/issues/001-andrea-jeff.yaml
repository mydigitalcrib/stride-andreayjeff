# B — The three films, in detail. The first one starts open.
five:
  kicker: Worth your time
  headline:
    - Three films
    - to *make this week*
  lead: Pick the one that feels most like you two, or batch all three.
  note: All three formats were on public trend trackers on 10 Nov, but Instagram and TikTok blocked direct viewing of the examples, so we can’t confirm when they were posted or how they did. The order is Stride’s editorial pick, not a prediction of views.
  items:
    - title: From first match to married life
      makeItYours: Turn an early photo of you two into today’s version of your multicultural marriage.
      what: "“Time: then and now” is a tracked format on Instagram and TikTok: an early memory, then a match cut to the present day."
      more: Open on a real early photo or screenshot with private details hidden, add a quick mock dating-app reaction, cut to two real memories, then match the old pose today. End by asking where your audience met their partner. Aim for 25 to 35 seconds.
      hook: De un match a una vida juntos…
      ways:
        - “Si ese primer mensaje no hubiera llegado…”
        - "Instagram: an emotional, photo-first montage."
        - "TikTok: a voiceover that sets up the first match."
      careful: Use only real photos and footage you both agree to share. If you recreate a moment, say it’s a recreation.
      brands: Travel and cultural tourism, home
      links:
        - label: See the format on Instagram
          url: https://www.instagram.com/reel/DfeYQukIzrD/
        - label: See it on TikTok
          url: https://www.tiktok.com/%40nursemikael_/video/7705622830091603213
    - title: Jeff’s costeño glow-up
      makeItYours: The before-and-after reveal, with Jeff’s Colombian Spanish and Andrea directing the joke.
      what: The “Entiende, corazón” before-and-after reveal was a tracked format on Instagram and TikTok on 10 Nov.
      more: Jeff starts formal, in a plain shirt, with a stiff greeting. Freeze on the beat change, then he’s back relaxed with a phrase he really uses while Andrea tries not to laugh. She asks him to define one real costeño word, and he gives a funny, respectful answer. Jeff’s love of Valledupar expressions has been covered before, so this is genuinely his story.
      hook: Jeff antes de conocer a una vallenata…
      ways:
        - “El español de Jeff, antes vs. después de Andrea”
        - "TikTok: stretch it to 30 seconds and let the comments choose the next word."
        - "Shorts: title it “Korean husband learns costeño Spanish”."
      careful: Check that Jeff is comfortable saying every phrase. Never make his mistakes or his accent the punchline.
      brands: Language and translation tools
      links:
        - label: See the format on Instagram
          url: https://www.instagram.com/reel/DfTDW1oNNtb/
        - label: See it on TikTok
          url: https://www.tiktok.com/%40karlassuarez/video/7704818472168983860
    - title: "Christmas mode: two cultures"
      makeItYours: A warm, funny reaction skit around the first Christmas song of the season.
      what: “Christmas music is back” was a tracked Instagram Reels format on 10 Nov.
      more: Andrea presses play on a holiday playlist, Jeff spots one small decoration, and Andrea appears behind him with a whole box. Cut between your two decorating styles, then reveal the finished, genuinely festive corner. End by asking about your audience’s holiday traditions.
      hook: Cuando pones villancicos en noviembre y Jeff todavía no está listo…
      ways:
        - “La Navidad en esta casa empieza cuando Andrea dice que empieza”
        - "TikTok: follow up by reacting to the “too early” comments."
        - "Shorts: keep your own dialogue as the main audio."
      careful: The disagreement is scripted, so adapt it to how you two really are. Check music rights, especially for sponsored posts.
      brands: Home and holiday
      links:
        - label: See a holiday couple example
          url: https://www.instagram.com/reel/DfNd88dS2Dg/

# C — No audience-comment research this week, so: questions to ask the audience.
talking:
  nav: Questions to ask
  kicker: Start the conversation
  headline:
    - What to ask
    - "*your*"
    - audience.
  lead: We couldn’t see your comments or Insights this week, so these are questions to ask, not ones we heard.
  questions:
    - text: ¿Ustedes cómo conocieron a su persona?
    - text: ¿Qué palabra colombiana debería aprender Jeff después?
    - text: ¿En sus casas desde cuándo se decora para Navidad?
  turn:
    title: Turn it into content
    body: "Reply to one real comment with a short clip: one word or pronunciation question from your audience. Then watch which themes come up most: Spanish expressions, food, holidays or your love story."
  care: Celebrate your own tastes rather than Colombian or Korean stereotypes, and never share private family messages.

# D — Seven ideas: the three films plus the brief's four extras.
ideas:
  kicker: Ready to film
  headline:
    - Seven ideas
    - "*only you two can make*"
  lead: The three films, plus four quick extras. Tap one to see the hook and how to film it, then save your favorites.
  filming: "Batch it: film the glow-up, the food swap and two couple POVs in one afternoon. One fixed camera spot, two outfit changes, 3 to 5 short vertical clips. Get a clean first 2 seconds, and end each with a question for the caption."
  careful: Celebrate your own tastes, not stereotypes. No pranks that look like a real fight, and no private family messages. Disclose paid partnerships, and check music rights before using a song in sponsored or boosted posts.
  segments:
    - id: love
      label: Love story
    - id: culture
      label: Culture & language
    - id: holiday
      label: Holidays
    - id: home
      label: Food & home
  items:
    - id: 1
      segment: love
      stage: Couple storytelling
      title: First match → The Chus
      format: Reel or TikTok
      time: 25–35 seconds
      level: Medium effort
      hook: De un match a una vida juntos…
      shots:
        - A real early photo or screenshot, private details hidden, with a date label.
        - Andrea holds up the phone with a mock dating-app reaction. Jeff walks in.
        - Two real memories, like an early trip, the proposal or the wedding. Only footage you both approve.
        - Match cut to today, in the same pose, laughing or walking hand in hand.
        - A warm look to camera. Ask where they met their partner.
      caption: De un mensaje a todas estas historias juntos. ¿Ustedes cómo conocieron a su persona? Cuéntennos.
      brands: Travel and cultural tourism, home
    - id: 2
      segment: culture
      stage: Culture & language
      title: Jeff’s costeño glow-up
      format: Reel or TikTok
      time: 25–35 seconds
      level: Low–medium effort
      hook: Jeff antes de conocer a una vallenata…
      shots:
        - Jeff in a plain shirt, looking formal, with “ANTES” on screen.
        - A stiff, careful greeting while Andrea reacts off camera.
        - Freeze on the beat change, or a spoken clap cue.
        - Jeff back, relaxed, with a phrase he really uses. Andrea tries not to laugh.
        - Andrea asks him to define one real costeño word. A funny, respectful answer.
        - Both laugh. End on “¿Qué palabra le enseñamos?”
      caption: El diccionario de Jeff ya tiene sabor costeño. ¿Qué palabra colombiana debería aprender después?
      brands: Language and translation tools
    - id: 3
      segment: holiday
      stage: Holidays
      title: "Christmas mode: two cultures"
      format: Reel
      time: 25–35 seconds
      level: Low effort
      hook: Cuando pones villancicos en noviembre y Jeff todavía no está listo…
      shots:
        - Andrea presses play on a holiday playlist. Jeff looks at the camera.
        - Jeff spots one small decoration. Andrea appears behind him with a whole box.
        - Cut to your two very different decorating styles.
        - "Quick montage: one adjusts the lights, the other insists on one more thing."
        - Reveal the finished, genuinely festive corner.
        - Ask about their holiday traditions.
      caption: Apareció la primera canción navideña y ya no hubo vuelta atrás. ¿En sus casas desde cuándo se decora?
      brands: Home and holiday
    - id: 4
      segment: culture
      stage: Culture · evergreen, not a fresh trend
      title: Our couple dictionary
      format: Short vertical video
      time: 10–20 min to make
      level: Low effort
      hook: Diccionario de pareja, palabras que Jeff ya usa
      shots:
        - Andrea challenges Jeff with three real Colombian phrases.
        - Jeff gives a Korean counterpart, only when one genuinely exists.
        - End by asking “¿Cuál nos faltó?”
      caption: ¿Cuál nos faltó?
      brands: Language and translation tools
    - id: 5
      segment: love
      stage: Marriage · a skit you can reuse
      title: Who decides dinner?
      format: Short vertical video, POV
      time: 25 seconds
      level: Low effort
      hook: ¿Quién decide qué cenamos?
      shots:
        - Three meal options.
        - You both pretend not to care which one wins.
        - An unexpected final pick. Base the lines on what you really like to eat.
    - id: 6
      segment: home
      stage: Food · brand-safe
      title: "Taste test: ají vs. gochujang"
      format: Short vertical video
      time: 25–35 min to make
      level: Medium effort
      hook: La prueba de sabor, ají vs. gochujang
      shots:
        - Pick two dishes you both already enjoy.
        - Swap one condiment.
        - Film each person’s real reaction, with one Spanish explanation and one Korean term if it helps.
      brands: Groceries and international ingredients
    - id: 7
      segment: home
      stage: Lifestyle · optional, evergreen
      title: Who does Jacob pick?
      format: Short vertical video
      time: 15 min to make
      level: Low effort
      hook: ¿A quién prefiere Jacob?
      shots:
        - Only if you want to include Jacob.
        - Each of you calls him once, in one take.
        - Keep a playful tally. Don’t stage the result.
      brands: Pet care

