# D — Seven ideas: the three films plus the brief's four quick concepts.
ideas:
  kicker: Ready to film
  headline:
    - Seven ideas
    - "*only you two can make*"
  lead: The three films, plus four quick concepts you can batch with them. Tap one to see the hook and how to film it, then save your favorites.
  filming: Film 2 or 3 concepts in one batch and adapt the edit for each platform. Keep subtitles large, and cut the silences but keep the reactions.
  careful: Use real props, real traditions and real reactions. Don’t stage mean-spirited arguments or speak for all Colombian or Korean families. For sponsored posts, check the commercial rights of every track; your own dialogue is the safest audio.
  segments:
    - id: comedy
      label: Comedy
    - id: holidays
      label: Holidays
  items:
    - id: 1
      segment: comedy
      stage: Couple comedy · film first
      title: How costeño is my husband?
      format: TikTok + Reels
      time: 25–30 seconds
      level: Low effort
      hook: Vamos a ver qué tan costeño está mi esposo coreano.
      shots:
        - "Andrea, to camera: “Amor, tienes tres segundos para rimar.”"
        - “Corazón.” “Canción.” “¡Epa!” Then “Vallenato.” “Zapato.” “¡Ay, pero este hombre!”
        - “Arepa.” Jeff improvises. Keep his real answer and your real reaction.
        - "Jeff: “Ahora te toca a ti en coreano.” Andrea: “No, espérate, tampoco así.”"
        - End laughing, with a quick challenge for viewers.
      caption: Yo muy confiada hasta que me tocó hablar coreano 😂 ¿Qué palabras le ponemos a Jeff en la parte 2?
    - id: 2
      segment: holidays
      stage: Holidays · this week
      title: Three cultures, one Christmas
      format: Reels + TikTok
      time: 28–35 seconds
      level: Low-to-medium effort
      hook: En esta casa la Navidad tiene tres culturas.
      shots:
        - "On screen: “Navidad colombo-coreana en Canadá.” Andrea: “Tenemos un problema: ¿cómo decoramos?”"
        - "Andrea shows something meaningful to her, like music, food or an ornament: “Yo quiero una Navidad bien colombiana.”"
        - "Jeff adds a tradition or holiday food he genuinely enjoys: “Y yo quiero incluir esto.”"
        - "A quick montage of your real choices: a grocery item, decorations, a cozy table, a candid disagreement."
        - You both reveal the final combination and react to it together.
        - "Andrea: “¿Qué tradición nos falta para la parte dos?” Jeff points to the comments."
      caption: Un poquito de Colombia, otro poquito de Corea y mucho amor desde Canadá. ¿Qué tradición navideña no puede faltar en tu casa?
      brands: Food and grocery, home and seasonal products
    - id: 3
      segment: comedy
      stage: Dramatic comedy
      title: Who ate my snacks?
      format: Reels + Shorts
      time: 22–30 seconds
      level: Low effort
      hook: Algo muy grave pasó en esta casa...
      shots:
        - "A close-up of an empty snack packet, with a dramatic zoom. On screen: “CASO 001: el snack desaparecido.”"
        - "Jeff, dead serious: “Andrea, tenemos que hablar.”"
        - "Andrea, innocently: “¿Sobre qué, amor?” Cut to the evidence, crumbs on the table."
        - Jeff points at the crumbs. Andrea gives an absurd, very short explanation.
        - A slow-motion reveal of the snack wrapper in Andrea’s hand.
        - "Andrea: “Bueno… ¿compramos más?” Jeff breaks character and laughs."
      caption: Yo solamente iba a probar uno… ¿quién es el culpable en su casa? 😂
      brands: Food and grocery
    - id: 4
      segment: comedy
      stage: Quick concept · based on the “Except Me Huss” reveal
      title: The Friday-night exception
      format: TikTok
      level: Low effort
      hook: Todos salen el viernes… menos nosotros.
      shots:
        - Open on “Todos salen el viernes… menos nosotros.”
        - Cut to your real movie night, with Korean food and Colombian snacks.
        - Keep the reveal personal.
    - id: 5
      segment: comedy
      stage: Quick concept · GTA-style
      title: Mission impossible, Colombian ingredients
      format: Instagram
      level: Medium effort
      hook: "Misión imposible: ingredientes colombianos"
      shots:
        - Andrea asks Jeff to find the ingredients she needs.
        - Add GTA-style mission graphics as he hunts for them.
        - End on his real reaction in the grocery store, and a funny result.
      brands: Food and grocery
    - id: 6
      segment: holidays
      stage: Holidays
      title: Costeño vs. Korean holiday playlist
      format: Short vertical video
      hook: Costeño vs. Korean holiday playlist
      shots:
        - Each of you picks two songs.
        - Play a short sample you’re allowed to use, or hum it or talk about it.
        - Give each other a playful rating. Your own audio works as a fallback.
    - id: 7
      segment: holidays
      stage: Holidays · Vancouver
      title: Our multicultural holiday date
      format: All platforms
      level: Medium effort
      hook: Our multicultural holiday date
      shots:
        - At a Vancouver holiday venue, one of you picks the snack and the other picks the activity.
        - Film your real reactions.
        - Check the venue’s hours and tickets before promising a visit.
      brands: Travel and local experiences

