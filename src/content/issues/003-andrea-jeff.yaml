# B — The three films, in detail. The first one starts open.
five:
  kicker: Worth your time
  headline:
    - Three films
    - to *make this week*
  lead: Film the rhymes first, then batch the other two.
  note: All three formats were documented by dated trend trackers on 26 Nov. Instagram and TikTok posts couldn’t always be opened, and the order is Stride’s creative pick, not a prediction of views.
  items:
    - title: How costeño is my husband?
      makeItYours: Andrea challenges Jeff to rhyme Spanish words under pressure, then Jeff turns it around in Korean.
      what: The rhyming challenge was in SocialBee’s TikTok formats on 26 Nov, with an original example. Your twist is the Spanish–Korean reversal.
      more: Andrea gives Jeff three seconds to rhyme “Corazón”, “Vallenato” and “Arepa”. Keep his real answers and your genuine reactions. Then Jeff challenges her in Korean. End with a quick challenge for viewers. It runs 25 to 30 seconds, with about 15–25 minutes to shoot and 25–40 to edit.
      hook: Vamos a ver qué tan costeño está mi esposo coreano.
      ways:
        - “Si Jeff me gana en español, me toca aprender coreano.”
        - "Reels: start on Andrea’s hook and add a pinned comment prompt."
        - "Shorts: subtitle both the Spanish and the Korean words."
      careful: Use your own spoken audio. If you add music, pick something licensed in the app and keep the dialogue easy to hear.
      links:
        - label: TikTok formats (SocialBee), 26 Nov
          url: https://socialbee.com/blog/tiktok-trends-you-cant-miss/
    - title: Three cultures, one Christmas
      makeItYours: A real holiday-prep moment where each of you picks one tradition you love, living in Canada.
      what: “Christmas is coming” was in Postdom’s Instagram trends on 26 Nov. Your version brings Colombian, Korean and Canadian moments into one home.
      more: Put “Navidad colombo-coreana en Canadá” on screen. Andrea shows something meaningful to her, Jeff adds a tradition or holiday food he genuinely enjoys, then a quick montage of your real choices and the final combination. It runs 28 to 35 seconds, with about 30–45 minutes to shoot.
      hook: En esta casa la Navidad tiene tres culturas.
      ways:
        - "“¿Quién decide cómo celebramos: Colombia, Corea o Canadá?”"
        - "TikTok: lean into the couple debate."
        - "Shorts: show the three traditions within the first two seconds."
      careful: Use props and things you really have. Don’t invent a tradition Jeff doesn’t practice, and don’t speak for all Colombian or Korean families.
      brands: Food and grocery, home and seasonal products
      links:
        - label: Instagram trends (Postdom), 26 Nov
          url: https://postdom.com/blog/instagram-trends
    - title: Who ate my snacks?
      makeItYours: A household mystery played as a crime documentary, with Jeff as the detective and Andrea as the suspicious witness.
      what: "“Everyday villain” was in Postdom’s Instagram trends on 26 Nov: an ordinary moment told like a dramatic true-crime story."
      more: Start on an empty snack packet with “CASO 001, el snack desaparecido”. Jeff, dead serious, says “Andrea, tenemos que hablar”. Crumbs as evidence, Andrea’s very short excuse, a slow-motion reveal of the wrapper in her hand, and “Bueno… ¿compramos más?”. It runs 22 to 30 seconds and takes about 15 minutes to film.
      hook: Algo muy grave pasó en esta casa...
      ways:
        - “Cuando tu esposo descubre que desaparecieron sus snacks coreanos.”
        - "Reels: a dramatic 20–25 second montage."
        - "Shorts: title it as a playful micro-mystery."
      careful: Keep it playful. Don’t stage a mean-spirited argument.
      brands: Food and grocery
      links:
        - label: Instagram trends (Postdom), 26 Nov
          url: https://postdom.com/blog/instagram-trends

